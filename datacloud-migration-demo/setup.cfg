[flake8]
max-line-length = 120
exclude = .git,__pycache__,target/output
per-file-ignores =
    # Databricks source notebooks: sys.path bootstrap + dbutils binding must precede lib imports
    target/notebooks/nb_*.py:E402
    # reference oracle keeps one dict literal per output row for auditability
    scripts/seed/generate_expected_outputs.py:E501

[tool:pytest]
testpaths = target/tests
