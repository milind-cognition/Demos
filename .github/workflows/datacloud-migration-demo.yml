name: datacloud-migration-demo

on:
  push:
    branches: [main]
    paths: ["datacloud-migration-demo/**", ".github/workflows/datacloud-migration-demo.yml"]
  pull_request:
    paths: ["datacloud-migration-demo/**", ".github/workflows/datacloud-migration-demo.yml"]

defaults:
  run:
    working-directory: datacloud-migration-demo

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: datacloud-migration-demo/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt flake8==7.3.0
      - name: Lint
        run: flake8
      - name: Seed + golden outputs are reproducible
        run: |
          python scripts/seed/generate_sample_data.py
          python scripts/seed/generate_expected_outputs.py
          git diff --exit-code -- legacy/sample_data legacy/expected_outputs
      - name: Legacy artifacts sanity (XML, shell, Java CohortTagger vs golden, shell stage vs golden)
        run: |
          python -c "import xml.dom.minidom as m; [m.parse('legacy/oozie/' + f) for f in ('workflow.xml', 'coordinator.xml')]"
          bash -n legacy/shell/stage_and_publish.sh legacy/shell/run_daily.sh
          javac -d /tmp/ct legacy/java/CohortTagger.java
          java -cp /tmp/ct com.acme.hrdata.jobs.CohortTagger legacy/sample_data/employees.csv legacy/sample_data/timecards.csv /tmp/ct/employee_cohorts.csv
          diff <(tail -n +2 /tmp/ct/employee_cohorts.csv | sort) <(tail -n +2 legacy/expected_outputs/cohort_tagger/employee_cohorts.csv | sort)
          (cd legacy && LOCAL_MODE=1 LOCAL_ROOT=/tmp/hr-local ./shell/stage_and_publish.sh stage 2024-03-15)
          diff <(sort /tmp/hr-local/staging/hr/_audit/dt=2024-03-15/_stage_audit.csv) <(sort legacy/expected_outputs/stage_and_publish/stage_audit.csv)
      - name: Unit + migration tests
        run: python -m pytest -q target/tests
      - name: Validate every migrated job
        run: python scripts/validate.py --all
